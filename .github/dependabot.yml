# Dependabot (frostyard/core ADR-0071, ADR-0075 and ADR-0089, baseline row
# B13): exactly 1 entry for each ecosystem with a manifest here. If an
# ecosystem has more than 1 directory, list them in directories. Each
# entry has a monthly schedule and 1 catch-all group. Each ecosystem then
# opens at most 1 version-update PR a month. Security updates stay
# ungrouped and immediate (no applies-to). internal/workflowcheck checks it.
#
# The npm entry updates the web bundle; its lockfile builds and tests in the
# nsl machine (make web-check), as CI does. Its git dependencies
# @frostyard/lodge-client and @frostyard/lodge-ui are lodge tags, so an
# update there is a lodge release.
#
# The commit prefix is build (or ci): svu reads it as a patch, not a feature.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      web-npm:
        patterns: ["*"]
