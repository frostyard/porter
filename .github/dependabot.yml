# Dependabot (frostyard/core ADR-0071, baseline row B13): 1 entry for each
# ecosystem with a manifest here. internal/workflowcheck checks the list.
#
# The npm entry updates the web bundle; its lockfile builds and tests in the
# nsl machine (make web-check), as CI does. Its git dependencies
# @frostyard/lodge-client and @frostyard/lodge-ui are lodge tags, so an
# update there is a lodge release.
#
# The commit prefix is build (or ci): svu reads it as a patch, not a feature.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      web-npm:
        patterns: ["*"]
