# PR triage caller (ADR-0068, ADR-0077, ADR-0078, docs/specs/pr-triage.md, and
# that of frostyard/core): this caller runs on pull_request_target so the
# trusted workflow and the base risk list execute. It does not run a PR branch.
# It checks out nothing. It adds level:L1 to level:L4, and risk:high at L1 and
# L2. It removes ready-for-human when the head moved after the label or when CI
# was not green at the label. It is not a required check, and it has no
# merge_group trigger. The job id stays pr-triage: the readiness step leaves out
# check runs whose name starts with pr-triage. The repository must have the
# risk:high label, or this job fails.
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@981e7aeb014cbd3efee710e99a5043fcc4763446 # core#246 (frostyard/core main, 2026-11-14)
