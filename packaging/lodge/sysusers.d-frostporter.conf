# Porter's system user, as /usr/lib/sysusers.d/frostporter.conf. It may use
# lodge's inference socket (group lodge-apps), and is never in group lodge.
# Group lodge owns the app socket (SocketGroup=lodge in frostporter.socket).
# This file declares the group too, so that the socket starts without
# lodge's own sysext (frostyard/core ADR-0058). The user is never a member
# of group lodge.
g lodge -
u frostporter - "Porter, behind lodge" /var/lib/frostporter
m frostporter lodge-apps
# Porter reaches the apps' MCP through lodge's agent socket (group
# lodge-agents), and lodge's configuration names it in "agents".
m frostporter lodge-agents

# User lodge, exactly as lodge's own sysusers.d/lodge.conf declares it, so
# that the app daemon (lodgeapp.LoadEnv) resolves it without lodge's
# sysext (snosi T401a). The lines must stay identical, or sysusers warns
# and keeps only the first.
u lodge - "lodge, the tailnet web shell for frostyard's apps" /var/lib/lodge
