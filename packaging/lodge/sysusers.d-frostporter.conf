# Porter's system user, as /usr/lib/sysusers.d/frostporter.conf. It may use
# lodge's inference socket (group lodge-apps), and is never in group lodge.
u frostporter - "Porter, behind lodge" /var/lib/frostporter
m frostporter lodge-apps
# Porter reaches the apps' MCP through lodge's agent socket (group
# lodge-agents), and lodge's configuration names it in "agents".
m frostporter lodge-agents
