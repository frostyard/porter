# nFPM config for frostyard-porterd (frostyard/core ADR-0011, ADR-0058). make deb
# stages the tree and runs nfpm; the Version comes from DEB_VERSION.
name: frostyard-porterd
arch: amd64
platform: linux
version: ${DEB_VERSION}
version_schema: none
section: net
priority: optional
maintainer: Brian Ketelsen <bketelsen@gmail.com>
description: |-
  Porter, the owner's personal assistant, for lodge.
  The porterd daemon, the Porter app's manifest and web bundle, its systemd
  units and its sysusers.d entry. It runs as lodge's porter app. Built for
  Snosi's sysext (ADR-0058).
vendor: frostyard
homepage: https://github.com/frostyard/porter
license: MIT
depends:
  - systemd
contents:
  - src: ./build/deb/root/usr
    dst: /usr
    type: tree
